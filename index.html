<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>发达国家 iOS 付费榜 · 智能体化机会</title>
<style>
:root{--bg:#0b0f14;--panel:#121821;--ink:#e8eef7;--muted:#8b9bb0;--line:#243041;--accent:#6ea8fe;--good:#3dd68c;--warn:#f5a524;--bad:#f07178}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:28px 20px 12px;max-width:1100px;margin:0 auto}h1{font-size:1.55rem;margin:0 0 8px}.sub{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chip{background:#1a2433;border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-size:12px;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:8px 20px 48px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
h2{font-size:1.1rem;margin:0 0 12px}.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;background:#0e141d;cursor:pointer}.item:hover{border-color:var(--accent)}.item h3{margin:0 0 6px;font-size:1rem}
.pri{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-bottom:8px}.pri.高{background:#163527;color:var(--good)}.pri.中{background:#3a2a12;color:var(--warn)}
.meta{color:var(--muted);font-size:12px;margin:4px 0}.cut{margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}select,input{background:#0e141d;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
footer{color:var(--muted);font-size:12px;max-width:1100px;margin:0 auto;padding:0 20px 40px}.err{color:var(--bad)}
button.app-btn{background:none;border:0;color:var(--accent);padding:0;font:inherit;cursor:pointer;text-align:left;border-bottom:1px dotted rgba(110,168,254,.55)}
button.app-btn:hover{border-bottom-style:solid}
tr.clickable{cursor:pointer}tr.clickable:hover td{background:rgba(110,168,254,.06)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.backdrop.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;width:min(440px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:50;display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer-hd{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:18px;border-bottom:1px solid var(--line)}
.drawer-hd h3{margin:0;font-size:1.15rem;line-height:1.35}
.drawer-bd{padding:14px 18px 28px;overflow:auto;flex:1}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;margin:10px 0 14px;font-size:13px}.kv .k{color:var(--muted)}
.tag{display:inline-block;background:#1a2433;border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin:2px 4px 2px 0;font-size:12px;color:var(--muted)}
.close-btn{background:#1a2433;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.note{background:#0e141d;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.empty{color:var(--muted);font-size:13px}
a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>发达国家 iOS 付费榜 · 智能体化机会</h1>
  <div class="sub" id="metaLine">加载中…</div>
  <div class="chips" id="countryChips"></div>
</header>
<main>
  <section class="card">
    <h2>智能体化短名单</h2>
    <div class="grid" id="shortlist"></div>
  </section>
  <section class="card">
    <h2>付费应用榜 · 跨国共现（≥5 国）</h2>
    <div style="overflow:auto"><table><thead><tr><th>App</th><th>国数</th><th>国家</th><th>品类</th><th>样例价</th></tr></thead><tbody id="coBody"></tbody></table></div>
  </section>
  <section class="card">
    <h2>各国榜单明细</h2>
    <div class="controls">
      <select id="countrySel"></select>
      <select id="listSel">
        <option value="overall_paid">付费总榜</option>
        <option value="paid_apps">付费应用</option>
        <option value="paid_games">付费游戏</option>
      </select>
      <input id="q" placeholder="搜索 App / 开发者" style="min-width:180px"/>
    </div>
    <div style="overflow:auto"><table><thead><tr><th>#</th><th>App</th><th>开发者</th><th>品类</th><th>价格</th></tr></thead><tbody id="rankBody"></tbody></table></div>
  </section>
</main>
<footer>
  点击 App 名打开右侧详情，展示我们汇总的多国榜位与智能体化备注，默认不跳转外站。<br/>
  仓库：<a href="https://github.com/wangrenzhu-ola/paid-app-charts">wangrenzhu-ola/paid-app-charts</a>
</footer>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-hd">
    <div>
      <h3 id="dTitle">—</h3>
      <div class="meta" id="dSub"></div>
    </div>
    <button class="close-btn" id="dClose" type="button">关闭</button>
  </div>
  <div class="drawer-bd" id="dBody"></div>
</aside>

<script>
let DATA = null;
const LIST_LABEL = {overall_paid:'付费总榜', paid_apps:'付费应用', paid_games:'付费游戏'};
const $ = (id) => document.getElementById(id);
function money(p){
  if(p==null||p==='') return '—';
  if(typeof p === 'string') return p;
  if(p.price==null||p.price==='') return '—';
  return `${p.currency||''} ${p.price}`.trim();
}
function esc(s){
  return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function appBtn(name, appId){
  return `<button type="button" class="app-btn" data-name="${esc(name||'')}" data-id="${esc(appId||'')}">${esc(name||'—')}</button>`;
}
function rowsFor(name, appId){
  const rows = DATA.rows || [];
  if(appId){
    const hit = rows.filter(r => String(r.app_id||'') === String(appId));
    if(hit.length) return hit;
  }
  return name ? rows.filter(r => r.app_name === name) : [];
}
function shortFor(name, appId){
  return (DATA.agent_shortlist||[]).find(it => (appId && String(it.app_id||'')===String(appId)) || it.name===name) || null;
}
function coFor(name, appId){
  return (DATA.cooccurrence_paid_apps||[]).find(it => (appId && String(it.app_id||'')===String(appId)) || it.app_name===name) || null;
}
function openDetail(name, appId){
  const rows = rowsFor(name, appId);
  const sample = rows[0] || {};
  const title = sample.app_name || name || '—';
  const short = shortFor(title, appId || sample.app_id);
  const co = coFor(title, appId || sample.app_id);
  const developer = sample.developer || (co && co.developer) || '—';
  const category = sample.category || (co && co.category) || '—';
  const id = sample.app_id || appId || (short && short.app_id) || '—';

  const byCountry = {};
  for(const r of rows){
    (byCountry[r.country] ||= {})[r.list_type] = r;
  }
  const countries = Object.keys(byCountry).sort();
  const listTypes = [...new Set(rows.map(r => r.list_type))];
  let matrix = countries.length
    ? `<table><thead><tr><th>国家</th>${listTypes.map(lt=>`<th>${LIST_LABEL[lt]||lt}</th>`).join('')}<th>价格</th></tr></thead><tbody>${
        countries.map(cc => {
          const bag = byCountry[cc];
          const any = listTypes.map(lt => bag[lt]).find(Boolean);
          const price = any ? `${any.currency||''} ${any.price||''}`.trim() : '—';
          return `<tr><td>${cc}</td>${listTypes.map(lt => `<td>${bag[lt] ? ('#'+bag[lt].rank) : '—'}</td>`).join('')}<td>${esc(price||'—')}</td></tr>`;
        }).join('')
      }</tbody></table>`
    : `<div class="empty">榜单里还没有这个 App 的抓取记录。</div>`;

  let shortHtml = '';
  if(short){
    shortHtml = `<div class="note">
      <div><span class="pri ${esc(short.priority||'')}">${esc(short.priority||'')}</span> 智能体化备注</div>
      <div class="meta">${(short.countries||[]).map(esc).join(' · ')}</div>
      <div style="margin-top:8px"><b>为何付费：</b>${esc(short.why_paid||'')}</div>
      <div class="cut"><b>Agent 切口：</b>${esc(short.agent_cut||'')}</div>
      <div class="meta" style="margin-top:6px">${esc(short.opportunity_type||'')}</div>
    </div>`;
  }
  let coHtml = '';
  if(co){
    coHtml = `<div class="note">
      <div><b>跨国共现</b> · ${co.country_count || (co.countries||[]).length} 国</div>
      <div class="meta" style="margin-top:6px">${(co.countries||[]).map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div>
      <div class="meta">样例价：${esc(money(co.sample_price))}</div>
    </div>`;
  }

  $('dTitle').textContent = title;
  $('dSub').textContent = `${developer} · ${category}`;
  $('dBody').innerHTML = `
    <div class="kv">
      <div class="k">App ID</div><div>${esc(id)}</div>
      <div class="k">开发者</div><div>${esc(developer)}</div>
      <div class="k">品类</div><div>${esc(category)}</div>
      <div class="k">上榜记录</div><div>${rows.length} 条（跨国家 / 榜类型）</div>
    </div>
    <h2 style="font-size:1rem;margin:8px 0">多国榜位（我们的数据）</h2>
    ${matrix}
    ${shortHtml}
    ${coHtml}
  `;
  $('drawer').classList.add('show');
  $('backdrop').classList.add('show');
  $('drawer').setAttribute('aria-hidden', 'false');
}
function closeDetail(){
  $('drawer').classList.remove('show');
  $('backdrop').classList.remove('show');
  $('drawer').setAttribute('aria-hidden', 'true');
}
function onClick(e){
  const t = e.target.closest('[data-name], .item[data-name], tr[data-name], .app-btn');
  // prefer explicit button/row attrs
  const el = e.target.closest('[data-name]');
  if(!el) return;
  // ignore clicks on interactive controls inside drawer
  if(el.closest && el.closest('#drawer') && !el.classList.contains('app-btn')) return;
  const name = el.getAttribute('data-name');
  const appId = el.getAttribute('data-id') || '';
  if(!name) return;
  e.preventDefault();
  openDetail(name, appId);
}
function renderMeta(){
  const m = DATA.meta || {};
  const countries = m.countries || [];
  $('metaLine').textContent = `抓取 ${m.fetched_at||'—'} · ${m.row_count||(DATA.rows||[]).length} 条 · ${countries.length} 国 · ${m.source||''}`;
  $('countryChips').innerHTML = countries.map(c=>`<span class="chip">${c}</span>`).join('');
  $('countrySel').innerHTML = countries.map(c=>`<option value="${c}">${c}</option>`).join('');
}
function renderShortlist(){
  $('shortlist').innerHTML = (DATA.agent_shortlist||[]).map(it => `
    <div class="item" data-name="${esc(it.name)}" data-id="${esc(it.app_id||'')}">
      <span class="pri ${esc(it.priority||'')}">${esc(it.priority||'')}</span>
      <h3>${esc(it.name)}</h3>
      <div class="meta">${(it.countries||[]).map(esc).join(' · ')}</div>
      <div><b>为何付费：</b>${esc(it.why_paid||'')}</div>
      <div class="cut"><b>Agent 切口：</b>${esc(it.agent_cut||'')}</div>
      <div class="meta">${esc(it.opportunity_type||'')}</div>
    </div>`).join('');
}
function renderCo(){
  const rows = (DATA.cooccurrence_paid_apps||[]).filter(r => (r.country_count||0) >= 5);
  $('coBody').innerHTML = rows.length ? rows.map(r => `
    <tr class="clickable" data-name="${esc(r.app_name)}" data-id="${esc(r.app_id||'')}">
      <td>${appBtn(r.app_name, r.app_id)}<div class="meta">${esc(r.developer||'')}</div></td>
      <td>${r.country_count}</td>
      <td>${(r.countries||[]).map(esc).join(', ')}</td>
      <td>${esc(r.category||'—')}</td>
      <td>${esc(money(r.sample_price))}</td>
    </tr>`).join('') : `<tr><td colspan="5" class="empty">当前没有 ≥5 国的付费应用共现。</td></tr>`;
}
function renderRanks(){
  const c = $('countrySel').value, lt = $('listSel').value, q = $('q').value.trim().toLowerCase();
  let rows = (DATA.rows||[]).filter(r => r.country===c && r.list_type===lt);
  if(q) rows = rows.filter(r => ((r.app_name||'')+(r.developer||'')).toLowerCase().includes(q));
  rows.sort((a,b)=>a.rank-b.rank);
  $('rankBody').innerHTML = rows.map(r => `
    <tr class="clickable" data-name="${esc(r.app_name)}" data-id="${esc(r.app_id||'')}">
      <td>${r.rank}</td>
      <td>${appBtn(r.app_name, r.app_id)}</td>
      <td>${esc(r.developer||'—')}</td>
      <td>${esc(r.category||'—')}</td>
      <td>${r.price ? `${esc(r.currency||'')} ${esc(r.price)}` : '—'}</td>
    </tr>`).join('') || `<tr><td colspan="5">无数据</td></tr>`;
}
async function main(){
  try{
    const res = await fetch('./data/latest.json');
    if(!res.ok) throw new Error(res.status+' '+res.statusText);
    DATA = await res.json();
    renderMeta();
    renderShortlist();
    renderCo();
    const available = new Set((DATA.meta && DATA.meta.list_types) || []);
    [...$('listSel').options].forEach(o => { o.disabled = available.size>0 && !available.has(o.value); });
    const first = [...$('listSel').options].find(o => !o.disabled);
    if(first) $('listSel').value = first.value;
    renderRanks();
    ['countrySel','listSel'].forEach(id => $(id).addEventListener('change', renderRanks));
    $('q').addEventListener('input', renderRanks);
    document.body.addEventListener('click', onClick);
    $('backdrop').addEventListener('click', closeDetail);
    $('dClose').addEventListener('click', closeDetail);
    document.addEventListener('keydown', e => { if(e.key==='Escape') closeDetail(); });
  }catch(e){
    $('metaLine').innerHTML = `<span class="err">加载失败：${esc(e.message)}</span>`;
  }
}
main();
</script>
</body>
</html>

name: Daily paid charts refresh
on:
  schedule:
    - cron: '0 1 * * *'  # 01:00 UTC ≈ 09:00 Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch charts
        run: python3 scripts/refresh.py
      - name: Commit if changed
        run: |
          git config user.name 'paid-charts-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/latest.json
          if git diff --staged --quiet; then
            echo 'No data changes'
          else
            git commit -m "chore: daily paid charts refresh $(date -u +%Y-%m-%d)"
            git push
          fi
